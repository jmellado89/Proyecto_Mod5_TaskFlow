<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Modulo 5</title>

    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>

    <!-- Mi JS -->
    <script type="module" src="./assets/js/script.js" defer></script>
</head>

<body>
    <!-- Añadir un Navbar -->
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fs-1">TaskFlow</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Añadir tareas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Ver Tareas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-4">
        <div class="container" id="poke-container">

        </div>
        <div class="row">
            <div class="col-md-6 ">
                <h2 class="pb-3">Crear tarea</h2>
                <form id="formTarea" class="border rounded-3 p-4 shadow">
                    <div class="m-3">
                        <label for="tarea" class="form-label">Descripción:</label>
                        <input type="text" class="form-control" id="tareaInput">
                        <div id="tareaHelp" class="form-text">Ingresa la descripción de tu tarea</div>
                    </div>
                    <div class="m-3">
                        <label for="fecha" class="form-label">Fecha Límite:</label>
                        <input type="datetime-local" class="form-control" id="tareaFecha" required>
                        <div id="fechaHelp" class="form-text">Ingresa la fecha en que la tarea debe ser
                            ejecutada</div>
                    </div>
                    <div class='m-3'>
                        <button type="submit" class="btn btn-primary" id="btnCrearTarea">Crear Tarea</button>
                    </div>
                </form>
            </div>
            <div class="col-md-6 my-3">
                <h2>Lista de tareas</h2>
                <ul class="list-group" id="listaTareas">


                </ul>
            </div>
        </div>

    </main>

</body>

</html>
